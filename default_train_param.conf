# CSafe Starlight V3 训练参数模板配置文件 (用于cli工具)
# 格式: 键 = 值 (等号两侧空格可有可无, 行首#为注释)
# 字段前缀: tspm_config. / lgbm_config. / 顶层(交叉训练配置)

# 参数全部经过调节，可以用于大部分数据集和设备进行高效训练
# 快说：谢谢to (qwq)

# tosSPM训练参数
tspm_config.preprune_factor = 100.0
tspm_config.max_root_support = 0.8
tspm_config.max_expan_ratio = 0.6
tspm_config.thread_count = 0
tspm_config.min_support = 0.002
tspm_config.max_skip = 2
tspm_config.max_length = 3
tspm_config.max_depth = 3
tspm_config.min_distinction = 0.75
# 噪声API自动过滤参数，目前的默认值是to提取出的最优配置，如果你愿意的话可以进一步优化~
tspm_config.noisy_api_min_benign_ratio = 0.06
tspm_config.noisy_api_max_mal_over_ben = 2.0
# 噪声API自动标记上限, 0表示不限制
tspm_config.max_noisy_api_count = 500

# LightGBM训练参数
lgbm_config.num_iterations = 3000
lgbm_config.learning_rate = 0.01
lgbm_config.num_leaves = 1023
lgbm_config.min_data_in_leaf = 100
lgbm_config.feature_fraction = 0.8
lgbm_config.bagging_fraction = 0.8
lgbm_config.bagging_freq = 1
lgbm_config.lambda_l2 = 3.0
lgbm_config.validation_ratio = 0.2
lgbm_config.early_stopping_rounds = 80
lgbm_config.random_seed = 42
lgbm_config.thread_count = 0
# 如果数据集不平衡的话需要把这个设置成true，这里默认开启
lgbm_config.is_unbalance = true

# 白签名表训练参数(authenticode_config)
# 训练前对语料全量扫描签名者身份, 按区分度筛选"几乎只出现在良性侧且样本量足够"的签名者入表,
# 推理时将签名者身份折叠为单一置信度维度供LightGBM使用
authenticode_config.white_ben_ratio = 0.99
authenticode_config.min_ben_count = 50

# 交叉训练参数
cross_validation_k = 3
random_seed = 42
thread_count = 0
# 单次读盘模式: 开启后样本加载阶段顺带算完静态特征, 每样本全程只读盘一次(关闭则读两次),
# 代价是每样本常驻约2.3KB特征(十万样本约290MiB)。机械盘/网络盘上建议开启
fast_read = true
